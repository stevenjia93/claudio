<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Claudio · 个人电台</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Fraunces:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="scenery" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="grid-spot" aria-hidden="true"></div>
  <div class="shooting-stars" id="shooting-stars" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <div>
        <h1>Claudio</h1>
        <p class="tag">个人 AI 电台 · <span class="en">a personal radio</span></p>
      </div>
    </div>
    <div class="pills">
      <span class="pill pill-coral">claude</span>
      <span class="pill pill-teal">netease</span>
      <button class="pill pill-action" id="btn-dj-lang" title="切 DJ 语种 (EN ⇄ 中)" aria-label="切 DJ 语种">🎙 EN</button>
      <span class="pill pill-dim" id="ws-pill">○ ws</span>
    </div>
  </header>

  <main class="layout">
    <!-- ————— 左栏: 现在播放 + 歌词 + 队列 ————— -->
    <section class="col col-left">
      <div class="card card-now">
        <div class="now-body">
          <div class="artwork" id="artwork">
            <div class="cover" id="cover"></div>
            <svg class="cover-fallback" viewBox="0 0 100 100" aria-hidden="true">
              <rect x="5" y="5" width="90" height="90" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2" />
              <line x1="5" y1="5" x2="95" y2="95" stroke="currentColor" stroke-width="1" opacity="0.3" />
              <line x1="95" y1="5" x2="5" y2="95" stroke="currentColor" stroke-width="1" opacity="0.3" />
            </svg>
          </div>

          <div class="track-info">
            <h3 id="song-name">—</h3>
            <p id="song-artist" class="muted">等一段话唤醒</p>
            <div class="progress">
              <div class="progress-bar" id="progress-bar" role="slider" aria-label="进度" tabindex="0">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-thumb" id="progress-thumb"></div>
              </div>
              <div class="timestamps">
                <span id="t-current" class="mono">0:00</span>
                <span id="t-total" class="mono muted">0:00</span>
              </div>
            </div>
            <div class="controls">
              <button id="btn-play" aria-label="播放/暂停" class="ctrl ctrl-main">▶</button>
              <button id="btn-next" aria-label="下一首" class="ctrl" title="下一首">⏭</button>
              <button id="btn-mode" class="ctrl" title="顺序播放">
                <svg class="mode-icon" data-mode="sequential" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <!-- 3 条横线 (像列表) + 右箭头, 表示"按列表顺序一首首过去" -->
                  <path d="M4 7 H17"/>
                  <path d="M4 12 H17"/>
                  <path d="M4 17 H17"/>
                  <path d="M19 9 L22 12 L19 15"/>
                </svg>
                <svg class="mode-icon" data-mode="shuffle" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                  <path d="M3 7 H8 L16 17 H21"/>
                  <path d="M18 14 L21 17 L18 20"/>
                  <path d="M3 17 H8 L16 7 H21"/>
                  <path d="M18 4 L21 7 L18 10"/>
                </svg>
                <svg class="mode-icon" data-mode="loop" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                  <!-- 圆环 + 两个箭头, 中间一个 "1" 表示"单曲循环" -->
                  <path d="M3 12 V8 A4 4 0 0 1 7 4 H17"/>
                  <path d="M14 1 L17 4 L14 7"/>
                  <path d="M21 12 V16 A4 4 0 0 1 17 20 H7"/>
                  <path d="M10 17 L7 20 L10 23"/>
                  <path d="M11 10 L12 9 L12 15"/>
                  <path d="M10.5 15 H13.5"/>
                </svg>
              </button>
              <button id="btn-like" aria-label="喜欢" class="ctrl ctrl-fb" title="喜欢这首,多推类似的">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path class="heart-outline" d="M12 20.5s-7.2-5.4-7.2-11A4.3 4.3 0 0 1 12 6.5a4.3 4.3 0 0 1 7.2 3c0 5.6-7.2 11-7.2 11z"/>
                  <path class="heart-fill" d="M12 20.5s-7.2-5.4-7.2-11A4.3 4.3 0 0 1 12 6.5a4.3 4.3 0 0 1 7.2 3c0 5.6-7.2 11-7.2 11z" fill="currentColor" stroke="none" opacity="0"/>
                </svg>
              </button>
              <button id="btn-dislike" aria-label="不喜欢" class="ctrl ctrl-fb ctrl-fb-x" title="不喜欢,自动切下一首">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <!-- 左半 -->
                  <path d="M12 7.2C11.1 5.7 9.6 4.6 7.6 4.6 5.1 4.6 3 6.7 3 9.4 3 14.2 12 20.5 12 20.5"/>
                  <!-- 右半 -->
                  <path d="M12 7.2C12.9 5.7 14.4 4.6 16.4 4.6 18.9 4.6 21 6.7 21 9.4 21 14.2 12 20.5 12 20.5"/>
                  <!-- 中间裂纹 (锯齿) -->
                  <path d="M12 7.2L10.7 11L13 14L11 17.5L12 20.5"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <audio id="audio" preload="auto"></audio>
      </div>

      <!-- 歌词 -->
      <div class="card card-lyrics" id="card-lyrics" hidden>
        <div class="lyrics-window" id="lyrics-window">
          <div class="lyrics-track" id="lyrics-track"></div>
        </div>
      </div>

      <!-- 列表三合一: 待播 / 已播 / 喜欢 -->
      <div class="card card-list">
        <div class="tabs" role="tablist">
          <button class="tab tab-active" data-tab="queue" role="tab">
            待播 <span class="en">queue</span>
            <span class="count mono" id="queue-count">0</span>
          </button>
          <button class="tab" data-tab="history" role="tab">
            已播 <span class="en">recent</span>
            <span class="count mono" id="history-count">0</span>
          </button>
          <button class="tab" data-tab="liked" role="tab">
            喜欢 <span class="en">liked</span>
            <span class="count mono" id="liked-count">0</span>
          </button>
          <button class="tab-more" id="btn-tabs-more" title="查看讨厌过的歌" aria-label="查看讨厌过的歌">⋯</button>
        </div>
        <div class="queue-toolbar" data-tab="queue">
          <button class="q-action" id="btn-queue-clear" title="清空待播列表">清空</button>
          <button class="q-action" id="btn-queue-refresh" title="让 Claude 重新推一批">换一批</button>
        </div>
        <ul id="queue-list" class="queue-list tab-pane tab-pane-active" data-tab="queue"></ul>
        <ul id="history-list" class="history-list tab-pane" data-tab="history" hidden></ul>
        <ul id="liked-list" class="history-list liked-list tab-pane" data-tab="liked" hidden></ul>
      </div>
    </section>

    <!-- ————— 右栏: 聊天 (始终可见) ————— -->
    <section class="col col-right">
      <div class="card card-chat">
        <div class="card-mini-head">
          <h2>想听点儿什么</h2>
          <span class="en">say something</span>
        </div>

        <ul id="chat-history" class="chat-history"></ul>

        <form id="chat-form" class="chat-form">
          <textarea
            id="chat-input"
            rows="2"
            placeholder="今晚有点闷,来点发呆的 / play 稻香 周杰伦 / next"
            autofocus
          ></textarea>
          <button type="submit" class="ctrl ctrl-send" id="btn-send">
            送出
          </button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p class="mono muted">claudio · 手工打造</p>
  </footer>

  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <!-- 讨厌过的歌 — 隐藏管理面板, ⋯ 按钮触发 -->
  <div class="disliked-overlay" id="disliked-overlay" hidden>
    <div class="disliked-panel" role="dialog" aria-label="讨厌过的歌">
      <div class="disliked-head">
        <span>讨厌过的歌 <span class="muted mono" id="disliked-count">0</span> · 点 ✕ 撤回, Claude 会重新可推</span>
        <button class="disliked-close" id="btn-disliked-close" aria-label="关闭">✕</button>
      </div>
      <ul class="history-list disliked-list" id="disliked-list"></ul>
    </div>
  </div>

  <!-- 误点 dislike 后底部 5s 自渐隐撤回 toast -->
  <div class="undo-toast" id="undo-toast" hidden>
    <span id="undo-toast-text"></span>
    <button class="undo-toast-btn" id="undo-toast-btn">撤回</button>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
